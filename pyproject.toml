[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maintai"
version = "0.1.0"
description = "Local-first predictive maintenance ML platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "pandas>=2.2,<3",
  "numpy>=2.0,<3",
  "scikit-learn>=1.6,<2",
  "joblib>=1.4,<2",
  "httpx>=0.27,<1",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
ml = ["matplotlib>=3.9,<4", "seaborn>=0.13,<1"]
test = ["pytest>=8.3,<9", "pytest-cov>=6,<8"]
dev = ["maintai[ml,test]", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
where = ["ml/src", "."]
include = ["maintai_ml*", "backend*", "simulator*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "ml/tests", "simulator/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

